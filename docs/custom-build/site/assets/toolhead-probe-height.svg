<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Cartographer coil height relative to the installed UHF nozzle</title>
<desc id="desc">Original side-view schematic showing the probe coil 2.6 to 3 millimeters above the nozzle tip plane, not to scale. UHF extenders adjust the probe position but do not change the cooling duct. Keep unintended metal out of the official coil keep-out and measure actual nozzle offsets.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#15283f}.h{font-size:23px;font-weight:bold}.t{font-size:19px}.sm{font-size:17px}.shape{fill:#d5e2f0;stroke:#203e60;stroke-width:3}.line{stroke:#203e60;stroke-width:3}.dash{stroke:#6b7c92;stroke-width:2;stroke-dasharray:7 5}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b44f23"/></marker></defs>
<rect width="960" height="440" fill="#fff"/>
<text x="24" y="35" class="h">T4 · Measure the finished UHF nozzle and probe together</text>
<text x="24" y="65" class="sm">Original explanatory schematic · not to scale · lateral offset deliberately unspecified</text>
<rect x="110" y="98" width="180" height="120" rx="12" class="shape"/>
<text x="129" y="134" class="t">UHF cartridge</text>
<text x="133" y="161" class="sm">validated ducts</text>
<rect x="151" y="217" width="96" height="55" rx="5" fill="#e9b259" stroke="#9c651e" stroke-width="3"/>
<path d="M177 272H221L199 337Z" fill="#e9b259" stroke="#9c651e" stroke-width="3"/>
<line class="dash" x1="88" y1="337" x2="716" y2="337"/>
<text x="28" y="369" class="t">Actual nozzle tip plane</text>
<path d="M320 118H370V246H396" fill="none" stroke="#203e60" stroke-width="14"/>
<text x="510" y="130" class="t">CNC carriage + confirmed</text>
<text x="510" y="157" class="t">extenders / hardware</text>
<rect x="396" y="246" width="138" height="37" rx="5" class="shape"/>
<line x1="397" x2="533" y1="283" y2="283" stroke="#b44f23" stroke-width="5"/>
<text x="550" y="260" class="t">Level coil underside</text>
<rect x="399" y="165" width="129" height="69" rx="6" fill="#e9b259" fill-opacity=".2" stroke="#b44f23" stroke-width="2" stroke-dasharray="6 4"/>
<text x="548" y="201" class="sm">Check official CAD keep-out</text>
<line x1="465" y1="283" x2="465" y2="337" stroke="#b44f23" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="551" y="313" class="h">2.6–3.0 mm ABOVE tip</text>
<text x="551" y="370" class="sm">Measure; do not assume extender fit.</text>
<rect x="24" y="395" width="912" height="4" fill="#ca5b25"/>
<text x="24" y="427" class="sm">Probe extenders lower the sensor; they do not make an HF cooling cartridge suitable for UHF.</text>
</svg>
