<text x="135" y="135">Confirm widths / revisions</text><text x="135" y="162">Inspect Z tensioners</text>
<text x="390" y="135">Rails + three backers</text><text x="390" y="162">Slots still accessible</text>
<text x="645" y="135">A/B + front + live XY</text><text x="645" y="162">Check shaft engagement</text>
<text x="900" y="135">Clamp allocation</text><text x="900" y="162">Rigid Z-joint interfaces</text>
