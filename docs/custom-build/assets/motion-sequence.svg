<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">Modified motion assembly dependency order</title><desc id="desc">Original schematic, not to scale: confirm parts, fit Z tensioners, install rails and backers before CNC ends, assemble CNC gantry, verify clamps and rigid Z joints, suspend gantry and fit Z belts, square and check Z binding, fit CNC carriage and six-millimetre XY belts, manually inspect travel.</desc>
<metadata>Original custom-guide schematic, GPL-3.0. Based on documented assembly dependencies; not a dimensional or belt-routing drawing.</metadata>
