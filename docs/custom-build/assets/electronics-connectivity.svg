<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">Proposed USB electronics architecture</title><desc id="desc">Original logical schematic, not connector orientation. Separate USB host routes to mainboard, Nitehawk adapter and Cartographer V4. Nitehawk toolhead heater remains isolated until electrical ratings close.</desc>
<rect width="1080" height="660" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="35" y="44" font-size="27" font-weight="bold">Proposed direct USB route — conditional on actual hardware</text><text x="35" y="74" font-size="18">Original logical schematic • not a dimensional drawing or crimp/pinout diagram</text>
<g fill="white" stroke="#45627d" stroke-width="2"><rect x="45" y="180" width="190" height="110" rx="8"/><rect x="345" y="110" width="250" height="90" rx="8"/><rect x="345" y="240" width="250" height="90" rx="8"/><rect x="345" y="410" width="250" height="110" rx="8"/><rect x="740" y="240" width="290" height="110" rx="8"/><rect x="740" y="420" width="290" height="100" rx="8"/></g>
<g font-size="22" text-anchor="middle"><text x="140" y="224">Verified host</text><text x="140" y="253">USB ports</text><text x="470" y="147">Verified Leviathan</text><text x="470" y="176" font-size="18">PCB / MCU gate E1</text><text x="470" y="277">Nitehawk USB adapter</text><text x="470" y="305" font-size="18">verified polarized 24 V supply</text><text x="470" y="448">Cartographer V4</text><text x="470" y="478" font-size="18">direct host USB + 5 V</text><text x="470" y="504" font-size="17">E4 cable / E5 firmware</text><text x="885" y="279">Matching Nitehawk SB</text><text x="885" y="307" font-size="18">original SB OR SB V2</text><text x="885" y="334" font-size="17">never CAN on this USB cable</text><text x="885" y="458">Rapido heater isolated</text><text x="885" y="488" font-size="18">E2 startup + full-path ratings</text></g>
<g fill="none" stroke="#2272b2" stroke-width="3"><path d="M235 207 H290 V155 H345"/><path d="M235 235 H300 V285 H345"/><path d="M235 264 H290 V465 H345"/><path d="M595 285 H740"/></g><text x="610" y="263" font-size="16">24 V + USB</text><path d="M885 350 V420" fill="none" stroke="#c45b26" stroke-width="3" stroke-dasharray="9 6"/>
<text x="35" y="580" font-size="19">SB V2 downstream USB is an optional gated route: verify 5-pin P8 → V4 cable, fuse and power.</text><text x="35" y="612" font-size="19">Protective earth, bed mains/SSR/fuse and discharge links need their own approved wiring plan.</text><text x="35" y="640" font-size="16">Do not apply 24 V to Cartographer USB. Do not hot-plug printer power/data connectors.</text></g></svg>
